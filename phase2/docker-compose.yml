version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: phase2/serving/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ../yc_startup_validator_app/model:/app/yc_startup_validator_app/model:ro
      - ../phase2/observability:/app/observability
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.14.1
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlflow

volumes:
  mlflow_data:
